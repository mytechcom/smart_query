[project]
name = "smart-query"
version = "1.0.0"
description = "智能问数系统：自然语言 → 意图识别 → NL2SQL → 可视化"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "config",
    "llm",
    "intent",
    "database",
    "nl2sql",
    "visualization",
    "api",
    "web",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
