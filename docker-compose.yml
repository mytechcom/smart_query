version: "3.8"

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: smart_query_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce}
      MYSQL_ROOT_HOST: "%"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- FastAPI 后端 ----------
  api:
    build: .
    container_name: smart_query_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器网络内通过服务名访问 MySQL
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy
    # 启动前先建表 + 灌 Mock 数据，再拉起服务
    command: sh -c "python database/init_db.py && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  # ---------- Streamlit 前端 ----------
  web:
    build: .
    container_name: smart_query_web
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    depends_on:
      - api
    command: streamlit run web/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  mysql_data:
